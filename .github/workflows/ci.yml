name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: jonphillips/ci-workflows/.github/workflows/ios-ci.yml@main
    with:
      package-path: UrbaneLibrary
      test-runner: macos-26
      min-swift: "6.4"
    secrets: inherit
