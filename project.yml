name: Urbane
options:
  bundleIdPrefix: com.jonphillips
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 7MQEE539G9
    CODE_SIGN_STYLE: Automatic
packages:
  UrbaneLibrary:
    path: UrbaneLibrary
targets:
  Urbane:
    type: application
    platform: iOS
    sources:
      - path: Urbane
    entitlements:
      path: Urbane/Urbane.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jonphillips.urbane]
    info:
      path: Urbane/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Urbane
        UrbaneAppGroupID: group.com.jonphillips.urbane
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: UrbaneLibrary
        product: UrbaneSchema
      - package: UrbaneLibrary
        product: UrbaneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonphillips.urbane
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Urbane/Urbane.entitlements
schemes:
  Urbane:
    build:
      targets:
        Urbane: all
    run:
      config: Debug
