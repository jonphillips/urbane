name: Urbane
options:
  bundleIdPrefix: com.jonphillips
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 7MQEE539G9
    CODE_SIGN_STYLE: Automatic
packages:
  UrbaneLibrary:
    path: UrbaneLibrary
  WebExtractorKit:
    path: ../jon-platform/packages/WebExtractorKit
  CloudSyncKit:
    path: ../jon-platform/packages/CloudSyncKit
  SQLiteData:
    path: ../jon-platform/Vendor/sqlite-data
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.6.0
  StructuredQueries:
    url: https://github.com/pointfreeco/swift-structured-queries
    from: 0.39.1
targets:
  Urbane:
    type: application
    platform: iOS
    sources:
      - path: Urbane
    entitlements:
      path: Urbane/Urbane.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jonphillips.urbane]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.jonphillips.urbane]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    info:
      path: Urbane/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Urbane
        UrbaneAppGroupID: group.com.jonphillips.urbane
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CKSharingSupported: true
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: UrbaneLibrary
        product: UrbaneSchema
      - package: UrbaneLibrary
        product: UrbaneCore
      - package: WebExtractorKit
        product: WebExtractorKit
      - package: CloudSyncKit
        product: CloudSyncKit
      - package: SQLiteData
        product: SQLiteData
      - package: GRDB
        product: GRDB
      - package: StructuredQueries
        product: StructuredQueriesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonphillips.urbane
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Urbane/Urbane.entitlements
schemes:
  Urbane:
    build:
      targets:
        Urbane: all
    run:
      config: Debug
      enableGPUValidationMode: disabled
