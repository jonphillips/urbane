only_rules:
  - file_length
  - type_body_length
  - function_body_length
  - view_persistence

included:
  - Urbane
  - UrbaneLibrary/Sources

excluded:
  - UrbaneLibrary/.build

file_length:
  warning: 450
  error: 650
  ignore_comment_only_lines: true

type_body_length:
  warning: 350
  error: 500

function_body_length:
  warning: 60
  error: 120

custom_rules:
  view_persistence:
    name: "Persistence in a View"
    regex: 'database\.(write|read)'
    included: ".*View\\.swift"
    message: "Views shouldn't touch the database — move it to a model or a tested core function."
    severity: warning
